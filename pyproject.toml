[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solsoc"
version = "1.0.0"
description = "AI-powered SOC alert triage CLI — cut through the noise, surface what matters."
readme = "README.md"
license = { text = "MIT with Commons Clause" }
requires-python = ">=3.9"
authors = [{ name = "Luis Troccoli", email = "ltrocc@gmail.com" }]
keywords = ["soc", "security", "triage", "alert", "siem", "ai", "llm", "wazuh", "sentinel", "splunk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.scripts]
solsoc = "solsoc.cli:app"

[project.optional-dependencies]
sentinel = [
    "azure-mgmt-securityinsight>=2.0.0",
    "azure-identity>=1.15.0",
]
all-integrations = [
    "azure-mgmt-securityinsight>=2.0.0",
    "azure-identity>=1.15.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "eval-type-backport>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["solsoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "TRY203", "TRY004"]
